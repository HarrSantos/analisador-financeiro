<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="../css/style.css">
    <title>Dashboard | Analisador Financeiro</title>
    <script src="../js/mock.js" defer></script>
    <script src="../js/app.js" defer></script>
    <script src="../js/dashboard.js" defer></script>
  </head>

  <body data-nav="dashboard" data-crumb="Dashboard">
    <div class="app">

      <!-- Sidebar e topbar são montadas por js/app.js (iguais em todas as páginas internas) -->
      <aside class="side" id="side"></aside>

      <div class="main">
        <header class="top" id="top"></header>

        <main class="page">

          <div class="hd">
            <div>
              <h1 id="oi">Olá</h1>
              <p>Resumo das suas análises de dados financeiros.</p>
            </div>
            <a class="btn" href="nova-analise.html"><span data-ic="plus"></span>Nova análise</a>
          </div>

          <!-- Indicadores (preenchidos por dashboard.js) -->
          <section class="kpis" id="kpis" aria-label="Indicadores"></section>

          <div class="cols">
            <section class="card pad" aria-labelledby="h-st">
              <h2 id="h-st">Análises por status</h2>
              <div class="dn">
                <div class="donut" id="donut" role="img"></div>
                <ul class="lg" id="lg"></ul>
              </div>
            </section>

            <section class="card pad" aria-labelledby="h-nv">
              <h2 id="h-nv">Anomalias por nível</h2>
              <p class="mut sm" id="ref"></p>
              <div id="bars"></div>
            </section>
          </div>

          <section class="card sec" aria-labelledby="h-rc">
            <header>
              <h2 id="h-rc">Análises recentes</h2>
              <a href="historico.html">Ver histórico completo</a>
            </header>

            <div class="tw">
              <table>
                <thead>
                  <tr>
                    <th>Arquivo</th>
                    <th class="num">ID</th>
                    <th>Data</th>
                    <th>Status</th>
                    <th><span class="vh">Ação</span></th>
                  </tr>
                </thead>
                <tbody id="rc"></tbody>
              </table>
            </div>
          </section>

        </main>
      </div>
    </div>
  </body>
</html>
